name: CI MOCK_IME

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: ${{ matrix.config.name }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        config:
          - {vlen: "16384", lambda: "8", name: "Default (VLEN=16384, lambda=8)"}
          - {vlen: "512", lambda: "2", name: "VLEN=512, lambda=2"}
          - {vlen: "4096", lambda: "4", name: "VLEN=4096, lambda=4"}
          - {vlen: "16384", lambda: "8", name: "VLEN=16384, lambda=8 (explicit)"}

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up QEMU and Docker
      uses: docker/setup-qemu-action@v3

    - name: Clone rv-toolchain-wrapper
      run: |
        mkdir -p $HOME/Projects/IME/SDK
        git clone https://github.com/efocht-oct/rv-toolchain-wrapper.git $HOME/Projects/IME/SDK/rv-toolchain-wrapper

    - name: Pull SDK Docker image
      run: |
        docker pull ghcr.io/efocht-oct/openchip/sdk:2026.05.28

    - name: Build MOCK_IME
      run: |
        export RV_CONTAINER_IMAGE=ghcr.io/efocht-oct/openchip/sdk:2026.05.28
        export PATH=$HOME/Projects/IME/SDK/rv-toolchain-wrapper/bin:$PATH
        make clean
        make all MOCK_IME=1

    - name: Test MOCK_IME (${{ matrix.config.name }})
      run: |
        export RV_CONTAINER_IMAGE=ghcr.io/efocht-oct/openchip/sdk:2026.05.28
        export PATH=$HOME/Projects/IME/SDK/rv-toolchain-wrapper/bin:$PATH
        make test VLEN=${{ matrix.config.vlen }} LAMBDA=${{ matrix.config.lambda }} MOCK_IME=1

    - name: Record test result
      if: always()
      run: |
        echo "MOCK_IME ${{ matrix.config.name }}: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
